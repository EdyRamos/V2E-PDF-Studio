[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "v2e-pdf-compressor"
version = "0.3.1"
description = "Suite desktop offline para organizar, dividir e comprimir PDFs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
authors = [{ name = "Eder A. Ramos" }]
dependencies = [
  "PyMuPDF==1.28.0",
  "PySide6==6.11.1",
]

[project.scripts]
v2e-pdf-studio = "v2e_pdf_compressor.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312" # Keep source/test tooling compatible while releases use Python 3.14.
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["UP042"] # Public enums intentionally retain their recovered str+Enum API.

[tool.mypy]
python_version = "3.14"
files = [
  "src/v2e_pdf_compressor/application",
  "src/v2e_pdf_compressor/config",
  "src/v2e_pdf_compressor/domain",
  "src/v2e_pdf_compressor/infra",
]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
