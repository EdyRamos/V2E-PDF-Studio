name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m ruff check src tests
      - run: python -m mypy
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m v2e_pdf_compressor.app --diagnostics
        env:
          PYTHONPATH: src

